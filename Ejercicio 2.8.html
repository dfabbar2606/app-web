<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="author" content="Daniel Fabregat">
        <style>
        /* Estilos para la tabla y sus bordes */
        table {
            width: 100%;
            border-collapse: collapse; /* Une los bordes dobles en uno solo */
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #000000; /* Define un borde sólido de 1px negro */
            padding: 8px; /* Añade espacio interno para que no quede pegado */
            text-align: center; /* Centra el texto de las celdas */
        }

        th {
            background-color: #f2f2f2; /* Color de fondo para los encabezados */
            font-weight: bold;
        }
    </style>
    </head>

    <body>
        <table summary="Horario de clases">
            <caption>Horario</caption>
            <thead>
                <tr>
                    <td rowspan="5">DIAS</td>
                </tr>
                <tr>
                     <td><strong>Lunes</strong></td>
                     <td><strong>Martes</strong></td>
                     <td><strong>Miercoles</strong></td>
                     <td><strong>Jueves</strong></td>
                     <td><strong>Viernes</strong></td>
                </tr>
            </thead>
            
             <tbody>
                <tr>
                    <td rowspan="8">HORARIO</td>
                </tr>
                <tr>
                    <td>SOR</td>
                    <td>SI</td>
                    <td>AW</td>
                    <td>AW</td>
                    <td>PY</td>
                </tr>

                <tr>
                    <td>SOR</td>
                    <td>SI</td>
                    <td>AW</td>
                    <td>AW</td>
                    <td>PY</td>
                </tr>

                <tr>
                    <td>SOR</td>
                    <td>IP</td>
                    <td>SR</td>
                    <td>IN</td>
                    <td>IP</td>
                </tr>

                <tr>
                    <td>PI</td>
                    <td>SOR</td>
                    <td>SR</td>
                    <td>IN</td>
                    <td>IP</td>
                </tr>

                <tr>
                    <td>PI</td>
                    <td>SOR</td>
                    <td>SI</td>
                    <td>SR</td>
                    <td>SR</td>
                </tr>

                <tr>
                    <td>PY</td>
                    <td>SOR</td>
                    <td>SI</td>
                    <td>SR</td>
                    <td>SR</td>
                </tr>
            </tbody>
            
            <tfoot>
                <td colspan="2">Horas semanales:</td>
                <td>30</td>
            </tfoot>
        </table>
    </body>
