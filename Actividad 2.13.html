<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="author" content="Daniel Fabregat">
    </head>
    
    <body>
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre"><br>

            <label for="email">Correo electronico:</label>
            <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com"><br>
 
            <label for="contraseña">Contraseña</label>
            <input type="contraseña" id="contraseña" name="contraseña" required placeholder="contraseña"><br>
            
            <label for="tel">Telefono:</label>
            <input type="tel" id="telefono" name="Telefono" required placeholder="telefono"><br>
            Donde vives:<br> <select name="Ciudad">
                <option value="Huelva" selected>Huelva</option>
                <option value="Cádiz" selected>Cádiz</option>
                <option value="Jáen" selected>Jáen</option>
                <option value="Sevilla" selected>Sevilla</option>
                <option value="Córdoba" selected>Córdoba</option>
                <option value="Granada" selected>Granada</option>
                <option value="Almeria" selected>Almeria</option>
                <option value="Málaga" selected>Málaga</option>
            </select><br>
            ¿Como te identificas?<br>
            <input type="radio" name="género" value="Hombre" checked>Hombre<br>
            <input type="radio" name="género" value="Mujer" checked>Mujer<br>
            <input type="radio" name="género" value="Otro" checked>Otro<br>
            <input type="checkbox" name="Aceptar" required>He aceptado los términos
            <input type="submit" name="envio" value="Enviar datos">
        </form>
    </body>
</html>
